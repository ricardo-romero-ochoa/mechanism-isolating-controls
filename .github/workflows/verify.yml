name: reproducibility-checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight verification dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas matplotlib
      - name: Verify frozen outputs
        run: python verify_results.py
      - name: Run self-tests
        run: make selftest
      - name: Regenerate figures
        run: make figures
